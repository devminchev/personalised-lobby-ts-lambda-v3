---
parameters:
  - name: sitename
    description: Venture name
    schema:
      type: string
    in: path
    required: true
  - name: platform
    description: Platform device type. Accepted values 'web', 'ios' and 'android'.
    schema:
      type: string
    in: path
    required: true
  - name: locale
    in: query
    description: Used for localization. Values are set in Contentful. Accepted values "en-GB", "en-CA", "en-US", "es-ES"
    schema:
      type: string
    required: false
get:
  summary: Mini Games
  x-controller: getMiniGames
  tags:
    - MiniGames
  responses:
    "200":
      description: Mini lobby layout - a list of objects containing 3 layouts, each with a few games inside and additional properties needed for rendering, carousel etc.
      content:
        application/json:
          schema:
            $ref: '../schemas/mini-games.yml'
    '400':
      $ref: '../schemas/error-responses.yml'
    '401':
      $ref: '../schemas/error-responses.yml'
    '403':
      $ref: '../schemas/error-responses.yml'
    '404':
      $ref: '../schemas/error-responses.yml'
    '429':
      $ref: '../schemas/error-responses.yml'
    '500':
      $ref: '../schemas/error-responses.yml'
    '502':
      $ref: '../schemas/error-responses.yml'
    '503':
      $ref: '../schemas/error-responses.yml'
    '504':
      $ref: '../schemas/error-responses.yml'
