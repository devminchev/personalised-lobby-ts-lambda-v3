title: Collab Based Personalised Section
description: Section Collab Based Personalised Section
required:
  - entryId
  - classification
  - layoutType
  - type
  - title
  - hasGames
properties:
  entryId:
    description: Unique id for the Collab Based Personalised Section
    type: string
  classification:
    description: Classification type of the section
    type: string
  title:
    description: Localized title for the section
    type: string
  hasGames:
    description: Flag to indicate if this section has games
    type: boolean
  layoutType:
    description: Layout type (can be `carousel-a`, `carousel-b`)
    type: string
  type:
    description: Type of Collab-based recommendations. `type` can be `personal-suggested-games`.
    type: string
  viewAll:
    type: object
    $ref: '../view-all-action.yml'
