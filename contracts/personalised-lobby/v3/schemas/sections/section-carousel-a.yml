title: Carousel A Section
description: Carousel A
required:
  - entryId
  - classification
  - layoutType
  - title
properties:
  entryId:
    description: Unique id for the carousel A section
    type: string
  classification:
    description: Classification type of the section
    type: string
  title:
    description: Localized title for the section
    type: string
  hasGames:
    description: Flag to indicate if this section has games
    type: boolean
  layoutType:
    description: Layout type (fixed to carousel-a)
    type: string
  viewAll:
    type: object
    $ref: '../view-all-action.yml'
